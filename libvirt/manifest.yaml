manifestVersion: 1
name: "@bad-at-naming/libvirt"
version: "2026.10.25.10"
license: "MIT AND Apache-2.0"
description: |
  Comprehensive libvirt/virsh management — VMs, networks, storage pools,
  volumes, snapshots, and host info — over SSH OR locally via a connection URI.

  Connection modes (per model instance):
  - SSH mode: set `host` (+ optional `user`) and virsh runs on the remote
    hypervisor over ssh. No local libvirt client needed.
  - Local/URI mode: omit `host` and virsh runs on the swamp host against
    `uri` (default qemu:///system; supports qemu+ssh://, qemu+tls://,
    qemu:///session, etc.).

  Models:
  - `@bad-at-naming/libvirt/vm` — domain lifecycle, tuning, monitoring, snapshots,
    guest agent, provisioning from cloud images (cloud-init seed built
    in TypeScript, no virt-install), connection facts, and a desired-state
    plan/sync reconciler
  - `@bad-at-naming/libvirt/network` — virtual network lifecycle + DHCP leases
  - `@bad-at-naming/libvirt/storage` — storage pool and volume management
  - `@bad-at-naming/libvirt/host` — hypervisor host info, capabilities, node stats

  Local/URI connection support is merged from @evrardjp's fork
  (github.com/evrardjp/swamp-local-libvirt) — see README for credit.

repository: "https://github.com/umag/swamp-workspace"
paths:
  base: manifest

models:
  - extensions/models/libvirt_vm.ts
  - extensions/models/libvirt_network.ts
  - extensions/models/libvirt_storage.ts
  - extensions/models/libvirt_host.ts

additionalFiles:
  - README.md
  - LICENSE.md
  - LICENSE-APACHE-2.0.txt

platforms: []

labels:
  - libvirt
  - virsh
  - kvm
  - qemu
  - virtualization
  - vm
  - homelab
  - ssh
