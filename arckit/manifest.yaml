manifestVersion: 1
name: "@magistr/arckit"
version: "2026.10.31.1"
license: MIT
description: |
  Standalone swamp port of ArcKit (https://github.com/tractorjuice/arc-kit —
  the Enterprise Architecture Governance Harness): a skill-driven governance
  state machine with the full arc-kit template corpus bundled. No ArcKit
  Claude plugin and no Python CLI required.

  Model type `@magistr/arckit/workspace`:

  ## State machine (one governance project per state artifact)

  ```
  startProject -> foundation -> context -> risk -> business-case ->
  requirements -> design -> procurement -> design-review -> delivery ->
  operations -> assurance -> story -> complete   (abandon from any state)
  ```

  `advance` re-scans the disk and refuses unless every gate group of the
  current phase has an ARC-* artifact present; `skipPhase` records an
  explicit bypass of skippable phases. Profiles (standard | uk-gov | mod |
  ai | nl-gov) add gate groups (uk-gov: tcop + secure; mod: mod-secure; ai:
  data-model + ai-playbook + atrs; nl-gov: nl-tbb + nl-cloud + nl-bio +
  nl-exit + eu-sovereignty). 000-global artifacts (e.g. principles) satisfy
  gates workspace-wide.

  ## Netherlands sovereign-cloud overlay (nl-gov)

  Six artifact types grounded in current Dutch and EU instruments —
  Herziening rijksbreed cloudbeleid 2026 (3 juli 2026), VIRBI 2025 with the
  Te Beschermen Belangen systematiek, Cbw + Wwke (in force 15 August 2026),
  BIO2, and the EU Cloud Sovereignty Framework v1.2.1. Two of them are
  computable rather than prose-only.

  ## Methods

  - startProject / status / advance / skipPhase / abandon — the lifecycle
  - template / templates / provisionTemplates — 193 bundled templates
    (65 arc-kit v6.18.3 core, 122 from its overlay plugins, 6 NL/EU), served
    with doc code, target ARC filename, mandatory input artifacts, and the
    Document Control header already filled in for the document's regime
  - init / scan / gaps — workspace scaffold, full artifact inventory,
    mandatory-dependency violation report
  - migrateClassification — port of `arckit migrate-classification`;
    `ladder` selects the target ladder (uae = UK → UAE Smart Data, the
    default and unchanged; nl = UK → NL rubricering), report-only by default
  - euSovereigntyScore — EU Cloud Sovereignty Framework v1.2.1 weighted
    score over SOV-1..SOV-8, the overall SEAL (the framework's actual
    rejection gate — the minimum SEAL across all eight objectives), and,
    with caller-supplied minimum SEAL floors, pass/fail per objective.
    Records an assessment; it does not certify
  - nlCloudEligibility — public-cloud eligibility under the Herziening
    rijksbreed cloudbeleid 2026, returning allowed | conditional |
    discouraged | prohibited with every fired clause and a plain-language
    reason

  Ships the `arckit` skill that drives Claude through the loop: status →
  fetch template → read mandatory inputs → produce artifact → human
  approval → advance.

repository: "https://github.com/umag/swamp-workspace"
paths:
  base: manifest

skills:
  - arckit

models:
  - extensions/models/arckit_workspace.ts

