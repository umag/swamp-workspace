manifestVersion: 1
name: "@magistr/musicbrainz"
version: "2026.08.07.2"
description: |
  MusicBrainz metadata — search, look up, and browse artists, release groups,
  releases, recordings, and labels via the MusicBrainz Web Service v2.

  Model:
  - `@magistr/musicbrainz` — typed search/lookup/browse over the MusicBrainz
    JSON API (built-in 1 req/sec rate limiting, enforced WITHIN one method
    invocation, with a single 503/Retry-After retry — callers that would
    otherwise fan out across invocations should use search-artists-batch,
    which loops MANY queries inside one invocation instead), a generic
    entity search, a cursored and resumable sync-artist-discographies
    fan-out that caches each artist's full release-group discography, plus
    Bandcamp-to-MusicBrainz helpers that scrape a Bandcamp discography and
    generate release-editor seed URLs for releases missing from MusicBrainz.

repository: "https://github.com/umag/swamp-workspace"
paths:
  base: manifest

models:
  - extensions/models/musicbrainz.ts

reports:
  - extensions/reports/discography_sync.ts

additionalFiles:
  - README.md
  - LICENSE.md
  - CHANGELOG.md

platforms: []

labels:
  - music
  - metadata
  - musicbrainz
