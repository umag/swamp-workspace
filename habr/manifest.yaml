manifestVersion: 1
name: "@magistr/habr"
version: "2026.10.15.3"
license: MIT
description: |
  Habr for swamp — read a Habr user's publications and full article bodies from
  Habr's public JSON API (habr.com/kek/v2), no credentials required.

  Model:
  - `@magistr/habr` — `list-articles` fans out over every page of a user's feed
    (by alias, e.g. `Milfgard`) and writes one `articles` resource with the
    parsed summaries (title, url, published time, reading time, complexity,
    tags, hubs, and read/vote/comment statistics), newest first. `get-article`
    fetches a single publication by its numeric id, including the full HTML
    body (`textHtml`).

repository: "https://github.com/umag/swamp-workspace"
paths:
  base: manifest

models:
  - extensions/models/habr.ts

additionalFiles:
  - README.md
  - LICENSE.md

platforms: []

labels:
  - habr
  - blog
  - articles
  - scraper
