name: Setup swamp
description: >
  Install a swamp release from the OFFICIAL distribution
  (https://swamp.club/install.sh) and add it to $PATH. Every call site in this
  repo (compliance + both extension-publish jobs) takes the "stable" default;
  the `version` input remains available to pin a specific release when a run
  has to be reproduced against an older binary.

inputs:
  version:
    description: >
      swamp release to install, passed straight to the installer's
      -V/--version: "stable" (default), "latest", or a specific release
      WITHOUT the leading "v" (e.g. "20260815.023608.0-sha.a648c130").
    required: false
    default: "stable"

runs:
  using: composite
  steps:
    - name: Install swamp (${{ inputs.version }})
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        set -eo pipefail
        # The official installer is the supported distribution channel and is
        # what the homelab containers already use. It resolves the platform
        # itself, so this no longer hardcodes a per-asset filename that only
        # exists while the upstream release layout stays put.
        dest="${RUNNER_TEMP}/swamp-bin"
        mkdir -p "$dest"
        echo "Installing swamp (${VERSION}) from https://swamp.club/install.sh"
        curl -fsSL --retry 3 --retry-delay 2 https://swamp.club/install.sh \
          | sh -s -- -d "$dest" -V "$VERSION"
        # Fail loudly here rather than letting a later step report the far more
        # confusing "Failed to spawn 'swamp': entity not found".
        if [ ! -x "$dest/swamp" ]; then
          echo "::error::swamp installer completed but $dest/swamp is missing or not executable"
          exit 1
        fi
        echo "$dest" >> "$GITHUB_PATH"
        "$dest/swamp" --version
