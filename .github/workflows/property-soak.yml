# Generic nightly rotating property-soak: auto-discovers every
# `<extension>/extensions/models/*_property_test.ts` file RECURSIVELY
# (scripts/soak_schedule.ts) and soaks tonight's 7-night-rotation bucket at
# a much higher fast-check iteration count than CI's tuned default. Each
# bucket entry carries the exact deno permission argv resolved from the
# extension's own deno.json `test` task (or, for the three broad-grant
# extensions, a narrowed `quality.yaml` `soak:` override) — scripts/
# run_soak.ts is invoked to actually run it, so the workflow YAML itself
# never hardcodes a one-size-fits-all permission set (the defect that used
# to silently NotCapable-fail 24 of 51 extensions every time the rotation
# reached them). Replaced stripe-mpp's bespoke property-soak workflow
# (deleted in the same commit as this file first landed).
#
# Nights with fewer than 7 discovered files are EXPECTED to have an empty
# bucket on some days — the `soak` job below is gated on
# `needs.discover.outputs.files != '[]'`, mirroring ci.yml's own
# `skill-review` / `skill-trigger-eval` empty-matrix guard: an empty array
# expands to an empty matrix, which GitHub marks as a FAILED run unless
# explicitly gated. An empty night is a green no-op, never a red run.
name: property soak

on:
  schedule:
    - cron: "37 3 * * *" # nightly, 03:37 UTC
  workflow_dispatch:
    inputs:
      runs:
        description: "fast-check numRuns override (nightly uses 1000000)"
        required: false
        default: "10000"
      target:
        description: "soak only this one extension's property files, overriding tonight's rotation"
        required: false
        default: ""
      all:
        description: "soak every discovered property test file, ignoring rotation"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  discover:
    name: discover tonight's soak bucket
    runs-on: ubuntu-latest
    outputs:
      files: ${{ steps.schedule.outputs.files }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.8.3

      - id: schedule
        working-directory: scripts
        env:
          # workflow_dispatch inputs, even from a trusted operator, are
          # passed via env — never spliced with `${{ }}` directly into this
          # script's text — matching the anti-injection discipline documented
          # in release-watch.yml.
          TARGET: ${{ github.event.inputs.target }}
          RUN_ALL: ${{ github.event.inputs.all }}
        run: |
          set -eo pipefail
          args=(--root .. --out ../soak-bucket.json)
          if [ "$RUN_ALL" = "true" ]; then
            args+=(--all)
          elif [ -n "$TARGET" ]; then
            args+=(--target "$TARGET")
          fi
          deno run --allow-read=.. --allow-write=../soak-bucket.json soak_schedule.ts "${args[@]}"
          {
            # Literal "EOF" delimiter, not a randomized one — safe ONLY
            # because soak-bucket.json's payload is guaranteed to be a
            # single line (JSON.stringify with no embedded newlines; see
            # serializeBucketForOutputFile's docblock in soak_schedule.ts
            # for the invariant and the test that pins it). A payload that
            # could ever legitimately contain a line reading exactly "EOF"
            # would need a randomized delimiter here instead.
            echo "files<<EOF"
            cat ../soak-bucket.json
            # Unconditional blank line: guarantees "EOF" starts on its own
            # line for the $GITHUB_OUTPUT heredoc parser even if the JSON
            # file itself doesn't end in a newline (defense in depth —
            # soak_schedule.ts's --out already writes a trailing newline).
            echo
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  soak:
    name: soak
    needs: discover
    if: needs.discover.outputs.files != '[]'
    runs-on: ubuntu-latest
    # A few-hour soak per property file; stays under GitHub's 6h per-job cap.
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        pair: ${{ fromJson(needs.discover.outputs.files) }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.8.3

      - name: Type-check ${{ matrix.pair.extension }}
        working-directory: ${{ matrix.pair.extension }}
        run: deno task check

      - name: Property soak (via run_soak.ts, resolved permission argv)
        env:
          # matrix.pair.file / matrix.pair.denoArgsJson are untrusted
          # workflow-generated data (a file path, a JSON-encoded argv
          # string) — passed through env, never spliced with `${{ }}`
          # directly into this step's run: body, matching the
          # anti-injection discipline release-watch.yml's header documents.
          EXTENSION: ${{ matrix.pair.extension }}
          FILE: ${{ matrix.pair.file }}
          DENO_ARGS_JSON: ${{ matrix.pair.denoArgsJson }}
          # Scheduled runs have no `runs` input → default to the multi-hour
          # 1,000,000-per-property soak (same convention as the original
          # stripe-mpp bespoke workflow). Manual dispatch uses the input.
          RUNS: ${{ github.event.inputs.runs || '1000000' }}
        run: |
          set -eo pipefail
          # No --allow-write here: run_soak.ts itself never writes a file
          # (only spawns the child `deno test` process and reads env vars) —
          # the CHILD process's own permission set comes entirely from
          # $DENO_ARGS_JSON, resolved separately below.
          deno run --allow-read --allow-run --allow-env \
            scripts/run_soak.ts \
            --extension "$EXTENSION" \
            --file "$FILE" \
            --deno-args-json "$DENO_ARGS_JSON" \
            --runs "$RUNS"
