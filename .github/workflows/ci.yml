name: CI

on:
  pull_request:
    branches: [master, main]
  push:
    branches: [master, main]

concurrency:
  # PRs: cancel superseded runs — only the newest push to a branch matters.
  #
  # master/main: NEVER cancel. Every push to master is a distinct RELEASE event.
  # `extension-publish` fires only on the one commit whose own diff carries the
  # `+version:` line (see "Detect manifest version changes" below), so a
  # cancelled master run drops that publish PERMANENTLY — the job has no retry
  # and no later run re-detects it. Merging two PRs within one run's duration
  # therefore de-published one of them silently. That is not hypothetical: on
  # 2026-08-07 #180 and #181 merged three seconds apart, #180's run was
  # cancelled, and @magistr/musicbrainz stayed a version behind the repo. A
  # sweep then found 18 packages in that state across 2026-08-01..07.
  #
  # Same group, so master runs still SERIALISE — they queue instead of racing,
  # which is what we want for a publish pipeline.
  group: ci-${{ github.ref }}
  cancel-in-progress: >-
    ${{ github.ref != 'refs/heads/master' && github.ref != 'refs/heads/main' }}

env:
  # swamp-registry per-version release notes are IMMUTABLE. `extension-publish`
  # truncates the CHANGELOG section to this many bytes before pushing, so an
  # over-cap section ships cut mid-line FOREVER. Defined once here because the
  # `release-notes-cap` guard and the publisher must agree on the number.
  REGISTRY_NOTES_CAP: 4900

permissions:
  contents: read

jobs:
  discover:
    name: discover extensions + skills
    runs-on: ubuntu-latest
    outputs:
      extensions: ${{ steps.scan.outputs.extensions }}
      skills: ${{ steps.scan.outputs.skills }}
    steps:
      - uses: actions/checkout@v6
        with:
          # Need history back to the diff base so we can scope the matrix to
          # just the extensions this change touches.
          fetch-depth: 0
      - id: scan
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -eo pipefail
          # Auto-discovery: no hand-maintained matrix lists. Every top-level
          # directory containing a manifest.yaml is treated as an extension.
          all_exts=$(for m in */manifest.yaml; do [ -f "$m" ] && dirname "$m"; done | sort -u)

          # --- Diff base: only test/review what this change actually touched. ---
          # PR   → net changes vs the base branch (base.sha → merge HEAD).
          # push → prior tip → HEAD (HEAD~1 fallback when `before` is absent).
          # Any failure to compute a diff degrades to the FULL matrix (safe).
          zero="0000000000000000000000000000000000000000"
          if [ "$EVENT" = "pull_request" ]; then
            changed=$(git diff --name-only "$PR_BASE_SHA" HEAD 2>/dev/null || true)
            reason="PR vs base ${PR_BASE_SHA:0:12}"
          elif [ "$EVENT" = "push" ] && [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "$zero" ] \
               && git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
            changed=$(git diff --name-only "$PUSH_BEFORE" HEAD 2>/dev/null || true)
            reason="push ${PUSH_BEFORE:0:12}..HEAD"
          elif git rev-parse HEAD~1 >/dev/null 2>&1; then
            changed=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || true)
            reason="push HEAD~1..HEAD"
          else
            changed=""
            reason="no diff base"
          fi

          # --- Classify each changed file (path-precise, two INDEPENDENT axes). ---
          #   <ext>/.claude/skills/<skill>/…  → review ONLY that skill
          #   <ext>/<anything-else>           → build/test ONLY that extension
          #                                     (model code, *_test.ts, manifest,
          #                                      deno.*, README/CHANGELOG — i.e.
          #                                      everything but its skill dirs)
          #   file OUTSIDE every extension dir (.github/, scripts/, root config)
          #                                   → FULL matrix (shared infra)
          # An empty/failed diff also forces FULL (fail safe). A skill-only change
          # runs no extension build; an extension-code change runs no skill review.
          global=false
          touched_exts=""    # extension dirs whose code/tests/config changed
          touched_skills=""  # "ext/skill" pairs whose skill dir changed
          if [ -z "$changed" ]; then
            global=true
          else
            while IFS= read -r f; do
              [ -z "$f" ] && continue
              top=${f%%/*}
              if ! printf '%s\n' "$all_exts" | grep -qxF "$top"; then
                global=true
                continue
              fi
              case "$f" in
                "$top"/.claude/skills/*/*)
                  rest=${f#"$top"/.claude/skills/}
                  skill=${rest%%/*}
                  touched_skills="${touched_skills}${top}/${skill}"$'\n'
                  ;;
                *)
                  touched_exts="${touched_exts}${top}"$'\n'
                  ;;
              esac
            done <<< "$changed"
          fi

          if [ "$global" = "true" ]; then
            echo "Scope: FULL — $reason (shared/global file changed or no diff)"
            sel_exts=$all_exts
            sel_skills="__ALL__"
          else
            echo "Scope: SCOPED — $reason"
            sel_exts=$(printf '%s\n' "$touched_exts" | sed '/^$/d' | sort -u)
            sel_skills=$(printf '%s\n' "$touched_skills" | sed '/^$/d' | sort -u)
          fi
          echo "Extension builds:"; printf '  %s\n' $sel_exts
          echo "Skill reviews:"; printf '  %s\n' $sel_skills

          # --- Extension (deno-check) matrix: JSON array of dir names. ---
          exts=$(printf '%s\n' "$sel_exts" | sed '/^$/d' | jq -R . | jq -cs .)
          echo "extensions=$exts" >> "$GITHUB_OUTPUT"
          echo "Extensions: $exts"

          # --- Skill (tessl) matrix: {extension, skill} pairs. Only pairs that
          # still have a SKILL.md are emitted (drops deleted / non-skill paths). ---
          emit_skill() { # $1=ext $2=skill
            [ -f "$1/.claude/skills/$2/SKILL.md" ] || return 0
            jq -nc --arg e "$1" --arg k "$2" '{extension:$e,skill:$k}'
          }
          if [ "$sel_skills" = "__ALL__" ]; then
            skills=$(for s in */.claude/skills/*/SKILL.md; do
                [ -f "$s" ] || continue
                ext=${s%%/*}; skill=$(basename "$(dirname "$s")")
                emit_skill "$ext" "$skill"
              done | jq -cs .)
          else
            skills=$(printf '%s\n' "$sel_skills" | sed '/^$/d' \
              | while IFS=/ read -r ext skill; do emit_skill "$ext" "$skill"; done \
              | jq -cs .)
          fi
          echo "skills=$skills" >> "$GITHUB_OUTPUT"
          echo "Skills: $skills"

  deno-check:
    name: deno (fmt, lint, check, test)
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        extension: ${{ fromJson(needs.discover.outputs.extensions) }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.8.3

      - name: Format check
        working-directory: ${{ matrix.extension }}
        run: deno task fmt:check

      - name: Lint
        working-directory: ${{ matrix.extension }}
        run: deno task lint

      - name: Type check
        working-directory: ${{ matrix.extension }}
        run: deno task check

      - name: Test
        working-directory: ${{ matrix.extension }}
        run: deno task test

      - name: Check model version matches manifest
        working-directory: ${{ matrix.extension }}
        run: |
          set -eo pipefail
          manifest_ver=$(grep -m1 '^version:' manifest.yaml \
            | sed -E 's/^version:[[:space:]]*"?([^"]+)"?.*/\1/')
          if [ -z "$manifest_ver" ]; then
            echo "::error::could not read version from manifest.yaml"; exit 1
          fi
          rc=0
          for f in extensions/models/*.ts; do
            case "$f" in *_test.ts | *.test.ts) continue ;; esac
            # Each model object's `version: "<calver>"` field must equal the
            # manifest version, so the published model type version and the
            # package version never drift (swamp warns when they do).
            while IFS= read -r mv; do
              if [ "$mv" != "$manifest_ver" ]; then
                echo "::error file=${{ matrix.extension }}/$f::model version \"$mv\" != manifest \"$manifest_ver\""
                rc=1
              fi
            done < <(grep -oE '^[[:space:]]*version:[[:space:]]*"[0-9][^"]*"' "$f" \
              | grep -oE '"[0-9][^"]*"' | tr -d '"')
          done
          exit $rc

      - name: Format check (scripts)
        working-directory: scripts
        run: deno fmt --check

      - name: Lint (scripts)
        working-directory: scripts
        run: deno lint

      - name: Type check (scripts)
        working-directory: scripts
        run: >-
          deno check build-promptfoo-tests.ts build-ci-report.ts quality/*.ts
          lib/watch_schema.ts lib/soak_permissions.ts release_watch.ts
          soak_schedule.ts run_soak.ts

  release-notes-cap:
    name: release-notes (fits the immutable registry cap)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Need the diff base to tell "this change bumps a version" from
          # "this version was already published long ago".
          fetch-depth: 0

      - name: Check the section that will ship fits the cap
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -eo pipefail
          # Only versions this change is ABOUT TO PUBLISH are checked. Sections
          # for versions already on the registry are deliberately ignored: their
          # notes are immutable, so editing the file cannot un-truncate them and
          # failing here would only block unrelated work on that package.
          zero="0000000000000000000000000000000000000000"
          if [ "$EVENT" = "pull_request" ]; then
            base="$PR_BASE_SHA"
          elif [ "$EVENT" = "push" ] && [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "$zero" ] \
               && git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
            base="$PUSH_BEFORE"
          else
            base="HEAD~1"
          fi
          if ! git rev-parse "$base" >/dev/null 2>&1; then
            echo "No usable diff base — nothing to check."; exit 0
          fi

          changed=$(git diff --name-only "$base" HEAD -- '*/manifest.yaml' || true)
          if [ -z "$changed" ]; then
            echo "No manifest touched vs ${base:0:12} — nothing to check."; exit 0
          fi

          rc=0
          checked=0
          while IFS= read -r manifest; do
            [ -z "$manifest" ] && continue
            git diff "$base" HEAD -- "$manifest" | grep -qE '^\+version:' || continue
            dir="$(dirname "$manifest")"
            ver="$(grep -m1 '^version:' "$manifest" \
              | sed -E 's/^version:[[:space:]]*"?([^"]+)"?.*/\1/')"
            checked=$((checked + 1))
            notes="$(scripts/changelog-section.sh "$dir/CHANGELOG.md" "$ver")"
            if [ -z "$notes" ]; then
              echo "::warning file=$dir/CHANGELOG.md::no '## $ver' section; the registry will get the commit message as release notes instead"
              continue
            fi
            bytes=$(printf '%s' "$notes" | wc -c | tr -d ' ')
            if [ "$bytes" -gt "$REGISTRY_NOTES_CAP" ]; then
              echo "::error file=$dir/CHANGELOG.md::'## $ver' section is $bytes bytes, over the ${REGISTRY_NOTES_CAP}-byte registry cap by $((bytes - REGISTRY_NOTES_CAP)). Per-version release notes are IMMUTABLE, so this would ship truncated mid-line forever. Trim the section, and put breaking-change and migration content FIRST so any future cut lands on the least important prose."
              rc=1
            else
              echo "ok  $dir  $ver  $bytes/${REGISTRY_NOTES_CAP} bytes"
            fi
          done <<< "$changed"

          [ "$checked" -eq 0 ] && echo "Manifest touched but no version line changed — nothing to publish."
          exit $rc

  compliance:
    name: compliance (extension quality standard)
    runs-on: ubuntu-latest
    # Deliberately NOT `needs: discover` and no diff-scoped `if:` — this job
    # runs GLOBAL, every extension, every PR and push, regardless of which
    # files a given change touched. See STANDARD.md "Why the compliance job
    # runs GLOBAL, not diff-scoped": a shared-file-only change (or an
    # extension rename) must never bypass per-extension enforcement.
    steps:
      - uses: actions/checkout@v6
        with:
          # checkBaselineImmutable (check_allowlist.ts) diffs
          # quality-offenders.baseline.txt against the merge-base with
          # origin/master, so real history is needed (not a shallow clone).
          fetch-depth: 0

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.8.3

      - name: Test (scripts)
        working-directory: scripts
        run: deno task test

      # Tracks the latest swamp release rather than a pin, matching the two
      # extension-publish jobs below. The pin it replaces (20260727.000815.0)
      # existed to keep `swamp extension quality` scores reproducible, but the
      # ratchet already handles the case it was guarding: score_ratchet.ts
      # compares rubricVersion first and reports a rubric change as
      # "rebaseline required", NOT a failure. What tracking latest does expose
      # is score drift WITHIN a rubric version — that surfaces as a ratchet
      # failure naming the extension and both percentages, which is the
      # signal we want rather than silently scoring against a stale binary.
      - name: Setup swamp (latest — the ratchet is rubric-version-aware)
        uses: ./.github/actions/setup-swamp

      - name: Smoke-check — this job stays tokenless
        run: |
          set -eo pipefail
          # `swamp extension quality` runs fully offline/local (verified
          # 2026-07: scores stripe-mpp and pihole with no auth configured at
          # all). This job must NEVER gain the publish-scoped SWAMP_API_KEY
          # the extension-publish job uses — a future workflow edit that
          # reintroduces it here would hand that credential to every PR run
          # for no reason. Guard it explicitly so that drift is loud.
          if [ -f "$HOME/.config/swamp/auth.json" ]; then
            echo "::error::swamp auth file present in the compliance job — it must stay tokenless"
            exit 1
          fi
          if [ -n "${SWAMP_API_KEY:-}" ]; then
            echo "::error::SWAMP_API_KEY set in the compliance job — it must stay tokenless"
            exit 1
          fi
          echo "OK: no swamp credentials present in this job"

      # Each of the three gates runs regardless of whether an earlier one
      # failed (`!cancelled()`, not the default "stop on first failure") —
      # the same aggregate-don't-abort philosophy check_compliance.ts itself
      # applies across extensions, applied here across gates: one CI run
      # surfaces every finding instead of a fix-push-fail-fix-push cycle.
      # The job's own conclusion still fails if ANY step below fails.
      - name: Check compliance (every extension's quality.yaml)
        if: ${{ !cancelled() }}
        working-directory: scripts
        run: deno task quality:check --json ../compliance-summary.json

      - name: Check allowlist (shrink-only + baseline immutability)
        if: ${{ !cancelled() }}
        working-directory: scripts
        run: deno task quality:allowlist --json ../allowlist-summary.json

      - name: Check score ratchet (never regress, rubric-version-aware)
        if: ${{ !cancelled() }}
        working-directory: scripts
        run: deno task quality:ratchet --json ../ratchet-summary.json

      - name: Check property-test harness (no .clone() in *_property_test.ts)
        if: ${{ !cancelled() }}
        working-directory: scripts
        run: deno task quality:harness --json ../property-harness-summary.json

      - name: Check soak permissions (property-soak permission source of truth)
        if: ${{ !cancelled() }}
        working-directory: scripts
        run: deno task quality:soak --json ../soak-summary.json

      - name: Upload compliance summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: compliance-summary
          path: |
            compliance-summary.json
            allowlist-summary.json
            ratchet-summary.json
            property-harness-summary.json
            soak-summary.json

  skill-review:
    name: skill-review (tessl)
    needs: discover
    runs-on: ubuntu-latest
    # TEMPORARILY DISABLED (2026-07-28): prompt-based checks are paused during
    # the extension-quality test backfill — every backfill PR edits root
    # quality files (quality-allowlist.txt), triggering the FULL matrix and
    # re-running every skill review, which re-fails the 3 known sub-90 skills
    # (issue-lifecycle: moldable-dev / review-security / review-skill; tracked
    # in the workspace-skill-review-rot lifecycle issue) and burns API spend.
    # RE-ENABLE by restoring the original condition below.
    # if: github.event_name == 'pull_request' && needs.discover.outputs.skills != '[]'
    if: false
    # Skip when no in-scope skill changed: an empty `skills` array expands to an
    # empty matrix, which GitHub marks as a failed run. Mirrors the same guard on
    # skill-trigger-eval / pr-report below.
    strategy:
      fail-fast: false
      matrix:
        pair: ${{ fromJson(needs.discover.outputs.skills) }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.8.3

      # Skill markdown used to be format-checked incidentally by the parent
      # extension's `deno task fmt:check`. Now that a skill-only change no longer
      # triggers that extension build, the skill owns its own fmt gate here —
      # run from the extension dir so it uses that extension's deno.json fmt
      # config (line width, etc.), matching the previous behavior exactly.
      - name: Format check skill markdown
        working-directory: ${{ matrix.pair.extension }}
        run: deno fmt --check ".claude/skills/${{ matrix.pair.skill }}"

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Review ${{ matrix.pair.skill }} with tessl
        env:
          # tessl authenticates from the TESSL_TOKEN env var (an API key minted
          # via `tessl api-key create`); the repo secret is named TESSL_API_KEY.
          TESSL_TOKEN: ${{ secrets.TESSL_API_KEY }}
        run: |
          set -eo pipefail
          # `--threshold 90` makes tessl exit non-zero when the skill scores
          # below 90% (native gating; replaces the old hand-rolled JSON parser,
          # whose score keys no longer match tessl's output schema). `--json` is
          # piped to a file for the uploaded report; pipefail propagates the
          # tessl exit code through `tee`.
          npx --yes tessl@0.80.0 skill review \
            "${{ matrix.pair.extension }}/.claude/skills/${{ matrix.pair.skill }}" \
            --threshold 90 --json | tee "tessl-${{ matrix.pair.skill }}.json"

      - name: Upload tessl report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tessl-${{ matrix.pair.skill }}
          path: tessl-${{ matrix.pair.skill }}.json

  skill-trigger-eval:
    name: skill-trigger-eval (promptfoo, sonnet)
    runs-on: ubuntu-latest
    needs: discover
    # TEMPORARILY DISABLED (2026-07-28): paused with skill-review during the
    # test backfill (see the comment there). RE-ENABLE by restoring:
    # if: github.event_name == 'pull_request' && needs.discover.outputs.skills != '[]'
    if: false
    # Skip when no in-scope skill changed. Trigger-collision eval is inherently
    # cross-skill, so when it DOES run it still evaluates every skill's triggers.
    steps:
      - uses: actions/checkout@v6

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.8.3

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Build promptfoo tests from per-skill JSONs
        run: deno run --allow-read --allow-write scripts/build-promptfoo-tests.ts

      - name: Run promptfoo eval (sonnet only)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -eo pipefail
          # promptfoo exits 100 when ANY test assertion fails. That is expected
          # here — the node check below is the real gate (>=90% trigger pass
          # rate), and promptfoo still writes the --output JSON on a 100 exit.
          # Any OTHER non-zero exit is a genuine error and must fail the step.
          ec=0
          npx --yes promptfoo@0.121.12 eval \
            -c promptfoo.generated.yaml \
            --output promptfoo-results.json || ec=$?
          if [ "$ec" -ne 0 ] && [ "$ec" -ne 100 ]; then
            echo "::error::promptfoo eval errored (exit $ec)"; exit "$ec"
          fi

          node -e "
            const r = require('./promptfoo-results.json');
            const total = r.results?.stats?.total
              ?? (r.results?.results?.length ?? 0);
            const passes = r.results?.stats?.successes
              ?? (r.results?.results || []).filter((x) => x.success).length;
            if (total === 0) {
              console.error('no results');
              process.exit(1);
            }
            const rate = passes / total;
            console.log('promptfoo pass rate: ' + passes + '/' + total + ' = ' + (rate * 100).toFixed(1) + '%');
            if (rate < 0.90) {
              console.error('FAIL: pass rate < 90%');
              process.exit(1);
            }
          "

      - name: Upload promptfoo report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: promptfoo-results
          path: |
            promptfoo.generated.yaml
            promptfoo-results.json

  pr-report:
    name: pr-report (sticky comment)
    runs-on: ubuntu-latest
    needs: [discover, skill-review, skill-trigger-eval, compliance]
    # Always run on PRs so the reports post even when a gate fails. The
    # compliance report runs GLOBAL on every PR, so (unlike the old
    # skills-only guard this replaced) there is always at least one report
    # worth posting — tessl/promptfoo sections just fall back to "no
    # artifact" placeholders when no in-scope skill changed.
    if: always() && github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.8.3

      - name: Download all gate artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Build full reports
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          deno run --allow-read --allow-write --allow-env \
            scripts/build-ci-report.ts artifacts

      - name: Upsert sticky PR comments
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -eo pipefail
          upsert() {
            local marker="$1" file="$2" id
            # Find an existing comment carrying this marker; edit it in place,
            # else create a new one. Keeps one sticky comment per report.
            id=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments?per_page=100" \
              --jq "map(select(.body | contains(\"$marker\"))) | .[0].id // empty")
            if [ -n "$id" ]; then
              gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${id}" \
                -F body=@"$file" >/dev/null
              echo "updated comment $id ($marker)"
            else
              gh pr comment "$PR" --body-file "$file"
            fi
          }
          upsert "ci-report:tessl" tessl-report.md
          upsert "ci-report:promptfoo" promptfoo-report.md
          upsert "ci-report:compliance" compliance-report.md

  extension-publish:
    name: extension-publish (on manifest version bump)
    runs-on: ubuntu-latest
    needs: deno-check
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Detect manifest version changes
        id: manifest-changed
        run: |
          set -eo pipefail
          changed=$(git diff --name-only HEAD~1 HEAD -- '*/manifest.yaml' || true)
          if [ -z "$changed" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No manifest changes in this push."
            exit 0
          fi
          version_diff=$(git diff HEAD~1 HEAD -- $changed | grep -E '^\+version:' || true)
          if [ -z "$version_diff" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Manifest touched but version line unchanged."
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "Changed manifests: $changed"
          echo "manifests<<EOF" >> "$GITHUB_OUTPUT"
          echo "$changed" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Setup swamp
        if: steps.manifest-changed.outputs.changed == 'true'
        uses: ./.github/actions/setup-swamp

      - name: Authenticate swamp
        if: steps.manifest-changed.outputs.changed == 'true'
        env:
          SWAMP_API_KEY: ${{ secrets.SWAMP_API_KEY }}
          SWAMP_API_KEY_ID: ${{ secrets.SWAMP_API_KEY_ID }}
        run: |
          set -eo pipefail
          if [ -z "$SWAMP_API_KEY" ]; then
            echo "::error::SWAMP_API_KEY secret is not set" >&2
            exit 1
          fi
          # swamp reads credentials from ~/.config/swamp/auth.json; it does NOT
          # honour any token env var. Build that file from the API-key secrets
          # (jq escapes the values safely).
          mkdir -p "$HOME/.config/swamp"
          jq -n \
            --arg key "$SWAMP_API_KEY" \
            --arg id "$SWAMP_API_KEY_ID" \
            '{
               serverUrl: "https://swamp-club.com",
               apiKey: $key,
               apiKeyId: $id,
               username: "magistr",
               collectives: ["bad-at-naming", "magistr"]
             }' > "$HOME/.config/swamp/auth.json"
          chmod 600 "$HOME/.config/swamp/auth.json"
          swamp auth whoami

      - name: Publish changed extensions
        if: steps.manifest-changed.outputs.changed == 'true'
        run: |
          set -eo pipefail
          # Per-version release notes are immutable on the swamp registry — if we
          # don't pass --release-notes, the swamp.club entry for that version is
          # empty forever. Prefer the extension's OWN CHANGELOG.md section for the
          # version being published (so the registry notes match the repo
          # changelog); fall back to the version-bump commit message. (The README
          # ships automatically via each manifest's additionalFiles.)
          commit_notes="$(git log -1 --format=%B HEAD | head -c "$REGISTRY_NOTES_CAP")"
          [ -z "$commit_notes" ] && commit_notes="Release of $(git rev-parse --short HEAD)"
          while IFS= read -r manifest; do
            [ -z "$manifest" ] && continue
            dir="$(dirname "$manifest")"
            ver="$(grep -m1 '^version:' "$manifest" \
              | sed -E 's/^version:[[:space:]]*"?([^"]+)"?.*/\1/')"
            # Extract the `## <ver> …` section from the extension's CHANGELOG.
            # scripts/changelog-section.sh is the SINGLE SOURCE OF TRUTH for this
            # extraction — the `release-notes-cap` job measures the very same
            # bytes at PR time, so the guard cannot pass while this ships
            # something different.
            notes=""
            if [ -n "$ver" ]; then
              notes="$(scripts/changelog-section.sh "$dir/CHANGELOG.md" "$ver" \
                | head -c "$REGISTRY_NOTES_CAP")"
            fi
            [ -z "$notes" ] && notes="$commit_notes"
            # Per-extension release channel selector: an optional
            # `<ext>/.release-channel` file (contents: beta | rc | stable)
            # chooses the swamp registry channel. Absent → stable, so existing
            # extensions publish exactly as before.
            channel="stable"
            if [ -f "$dir/.release-channel" ]; then
              channel="$(tr -d '[:space:]' < "$dir/.release-channel")"
              case "$channel" in
                beta|rc|stable) ;;
                *) echo "::error::$dir/.release-channel must be beta|rc|stable (got '$channel')" >&2; exit 1 ;;
              esac
            fi
            echo "Publishing $manifest @ ${ver:-?} to '$channel' channel"
            # -y is REQUIRED in CI: without it `extension push` prompts
            # "Push … to registry? [y/N]" and, with no TTY, defaults to No and
            # silently cancels (exit 0 → false-green). -y also accepts the
            # Deno.Command safety warning prompt.
            # Single-root-repo layout: run push from the repo root with the full
            # manifest path. Each manifest sets `paths.base: manifest`, so its
            # `models:`/`reports:`/`additionalFiles:` resolve relative to the
            # manifest's own subdirectory.
            swamp extension push "$manifest" -y --channel "$channel" --release-notes "$notes"
          done <<< "${{ steps.manifest-changed.outputs.manifests }}"

  registry-drift:
    name: registry-drift (repo vs registry)
    runs-on: ubuntu-latest
    # Runs AFTER publish, on master only, and `always()` so it still reports
    # when extension-publish itself failed — a failed publish is exactly the
    # state this job exists to make visible.
    needs: extension-publish
    if: >-
      always() && github.event_name == 'push'
      && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - uses: actions/checkout@v6

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.8.3

      - name: Setup swamp
        uses: ./.github/actions/setup-swamp

      - name: Authenticate swamp
        env:
          SWAMP_API_KEY: ${{ secrets.SWAMP_API_KEY }}
          SWAMP_API_KEY_ID: ${{ secrets.SWAMP_API_KEY_ID }}
        run: |
          set -eo pipefail
          if [ -z "$SWAMP_API_KEY" ]; then
            echo "::error::SWAMP_API_KEY secret is not set" >&2
            exit 1
          fi
          mkdir -p "$HOME/.config/swamp"
          jq -n \
            --arg key "$SWAMP_API_KEY" \
            --arg id "$SWAMP_API_KEY_ID" \
            '{
               serverUrl: "https://swamp-club.com",
               apiKey: $key,
               apiKeyId: $id,
               username: "magistr",
               collectives: ["bad-at-naming", "magistr"]
             }' > "$HOME/.config/swamp/auth.json"
          chmod 600 "$HOME/.config/swamp/auth.json"
          swamp auth whoami

      - name: Every declared version exists on the registry
        working-directory: scripts
        run: deno task registry-drift
