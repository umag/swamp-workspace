                      has_attended: false
                      id: 129
                      is_member_first_booking: false
                      is_no_show: false
                      location_id: 269
                      member_id: 579
                      no_show_penalty_applied: false
                      no_show_registered_at: null
                      pass_id: 6798
                      session_id: 221
                      session_start_date: '2025-11-25T14:00:00.00000+01:00'
                      source: app
                      spot_id: 13
                      spot_information: {}
                      substitute_teacher_id: null
                      teacher_id: 273
                  summary: Booking response example
          description: ''
        '401':
          content:
            application/json:
              schema:
