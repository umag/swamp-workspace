openapi: 3.0.3
info:
  title: bsport public API
  version: v1
  description: Open API documentation
paths:
  /api/v1/billing_plans/:
    get:
      operationId: billing_plans_list
      description: Retrieve all billing plans related to the user's company
      summary: List all billing plans
      parameters:
      - in: header
        name: X-Client-ID
        schema:
          type: string
        description: Header to identify the client making this API request.
        required: true
        examples:
          ClientID:
            value: my-company
            summary: Client ID
      - in: header
        name: X-Company-ID
        schema:
          type: string
        description: Header to identify the target company for this API request.
        required: true
        examples:
          CompanyID:
            value: '12345'
            summary: Company ID
      - in: header
        name: X-Franchisor-ID
        schema:
          type: string
        description: Header to identify the target franchisor for this API request,
          if the API Key was issued at franchise level.
        examples:
          FranchisorID:
            value: '67890'
            summary: Franchisor ID
      - in: header
        name: X-Timezone-Name
        schema:
          type: string
        description: Header to override the client timezone for this API request.
        examples:
          Timezone:
            value: Europe/Paris
      - in: query
        name: benefit_id
        schema:
          type: number
      - in: query
        name: benefit_type
        schema:
          type: string
          enum:
          - payment_combo
          - payment_pack
          - private_pass
        description: |-
          * `payment_combo` - Payment Combo
          * `payment_pack` - Payment Pack
          * `private_pass` - Private Pass
      - in: query
        name: id__in
        schema:
          type: array
          items:
            type: number
        description: Multiple values may be separated by commas.
        explode: false
        style: form
      - in: query
        name: member_id
        schema:
          type: integer
      - in: query
        name: ordering
        schema:
          type: string
        description: |-
          Comma-separated list of fields to order by:
          - date_created
          - first_billing_date
          - name
          - recurrent_price
          - started_at

          Prefix with '-' for descending order.
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - Deprecated - Billing Plans
      security:
      - ApiKey: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDeprecatedBillingPlanOutputList'
              examples:
                BillingPlanResponse:
                  value:
                    count: 123
                    next: http://api.example.org/accounts/?page=4
                    next_page: 4
                    previous: http://api.example.org/accounts/?page=2
                    results:
                    - auto_renewal: false
                      benefit_id: 111
                      benefit_type: payment_pack
                      canceled_at: null
                      commitment_period_unit: month
                      commitment_period_value: 1
                      contract: 222
                      contract_terms_date_accepted: '2025-12-17T11:30:22.983966+01:00'
                      contract_terms_pdf_link: https://...
                      date_created: '2025-12-17T11:30:22.984111+01:00'
                      description: 'Contract #222'
                      first_billing_date: '2025-12-17T11:30:22Z'
                      flat_fee: '0.00'
                      has_discount: false
                      has_mandatory_commitment_period: false
                      id: 123
                      interval: month
                      invoices:
                      - 5fee939d-e0ce-4898-8cd7-02d09c86fbbd
                      is_member_cancellation_allowed: true
                      is_within_commitment_period: true
                      legal_contract: Contract terms ...
                      member: 999
                      month_billing_day: 1
                      name: Contract name
                      nb_interval: 8
                      nb_interval_after_auto_renewal: null
                      note: ''
                      pauses: []
                      payment_engine: 0
                      payment_method_identifier: 14
                      recurrence_basis: 1
                      recurrent_price: '32.00'
                      started_at: null
                      status: 2
                  summary: Billing Plan response
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericErrorOutput'
              examples:
                AuthErrorResponse:
                  value:
                    detail: Missing mandatory header X-Client-ID
                  summary: Auth error response
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericErrorOutput'
              examples:
                ForbiddenErrorResponse:
                  value:
                    detail: Authentication credentials were not provided.
                    status: 403
                  summary: Forbidden error response
          description: ''
      x-bsport-domain: buyable
