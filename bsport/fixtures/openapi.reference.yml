        examples:
          FranchisorID:
            value: '67890'
            summary: Franchisor ID
      - in: header
        name: X-Timezone-Name
        schema:
          type: string
        description: Header to override the client timezone for this API request.
        examples:
          Timezone:
            value: Europe/Paris
      tags:
      - Deprecated - Bookings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeprecatedBookingCreationInput'
            examples:
              BookingCreationRequestExampleForManager:
                value:
                  pass_id: 1
                  session_ids:
                  - 2
                  spot_id: 4
                  auto_assign_spot: false
                  notify_member: true
                  keep_credits: true
                summary: Booking creation request example for manager
              BookingCreationRequestExampleForMember:
                value:
                  pass_id: 1
                  session_ids:
                  - 2
                  - 3
                  - 7
                  spot_id: 4
                  auto_assign_spot: false
                summary: Booking creation request example for member
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DeprecatedBookingCreationInput'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DeprecatedBookingCreationInput'
        required: true
      security:
      - ApiKey: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeprecatedBookingsListOutput'
              examples:
                BookingsListResponseExample:
                  value:
                    bookings:
                    - attendance_status_updated_at: '2025-11-25T13:53:53.535647+01:00'
                      booking_status_code: OK
                      canceled_at: null
                      company_id: 12345
                      created_at: '2025-11-25T13:52:53.535678+01:00'
                      credit_consumed: 4
                      credit_refunded: false
                      has_attended: false
                      id: 129
                      is_member_first_booking: false
                      is_no_show: false
                      location_id: 269
                      member_id: 579
                      no_show_penalty_applied: false
                      no_show_registered_at: null
                      pass_id: 6798
                      session_id: 221
                      session_start_date: '2025-11-25T14:00:00.00000+01:00'
                      source: app
                      spot_id: 13
                      spot_information: {}
                      substitute_teacher_id: null
                      teacher_id: 273
                  summary: Bookings list response example
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericValidationError'
              examples:
                GenericValidationErrorResponse:
                  value:
                    non_field_errors:
                    - Validation error on multiple related fields.
                    errors:
                      field:
                      - This field is required.
                      another_field:
                      - This field must be a valid date
                      nested:
                        field:
                        - A valid integer is required.
                        nested:
                          field:
                          - This field may not be blank.
                  summary: Generic request validation error response
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericErrorOutput'
              examples:
                AuthErrorResponse:
                  value:
                    detail: Missing mandatory header X-Client-ID
                  summary: Auth error response
          description: ''
        '403':
          content:
