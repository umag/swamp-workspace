tags:
- name: Appointments
  description: |-
    A private, one-on-one session booked by a client.
    Appointments provide detailed information about the scheduled time, assigned teacher, venue, and booking status.

    Filters: `service_id`, `venue_id`, `teacher_id`, `client_id`, `period_start` (defaults to now) and `period_end` (defaults to now + 30 days).

    ### Exceptions
    | code | status | detail |
    |------|--------|--------|
    |APP-001|404|Appointment not found|
- name: Bookings
  description: |-
    Bookings represent reservations for classes. Use these endpoints to list,
    create, fetch, or cancel reservations for clients. Common workflows include
    showing upcoming bookings, retrieving attendance history, and managing
    cancellations with optional refund/notification behavior.

    Key details:
    - Filters: `client_id`, `activity_id__in`, `booking_status_code`, date windows,
      `available`, `future_bookings`, `past_bookings`
    - Cancelling may accept options to notify and/or refund when permitted

    ### Exceptions
    | code | status | detail |
    |------|--------|--------|
    |BOO-001|404|Booking not found|
    |BOO-101|403|The pass is not compatible with the class|
    |BOO-102|403|Too many bookings for given pass|
    |BOO-103|403|Class not available for booking|
    |BOO-104|409|Failed to lock class spot|
    |BOO-105|409|Spot already taken|
    |BOO-106|403|Overbook not allowed for current Staff member|
    |BOO-107|403|The pass does not have enough credits for the class|
    |BOO-201|403|Past bookings cannot be cancelled|
    |BSPORT-500|500|An unexpected error occurred|
- name: Classes
  description: |-
    A Class represents a scheduled activity, or workshop that a member can book and attend.
    Classes provide detailed information about the time, location, instructor, and capacity of each scheduled class.

    Filters: `service_id`, `venue_id`, `teacher_id`, `period_start` (defaults to now) and `period_end` (defaults to now + 30 days).

    ### Exceptions
    | code | status | detail |
    |------|--------|--------|
    |CLA-001|404|Class not found|
- name: Client Notes
  description: |-
    Client notes let you store operational or medical follow-up notes on
    a client. The resource is company-scoped and only exposes notes from the
    authenticated manager's company.

    ### Exceptions
    | code | status | detail |
    |------|--------|--------|
    |MNO-001|404|Client note not found|
    |BSPORT-500|500|An unexpected error occurred|
- name: Client Passes
  description: |-
    Passes are one of the most important elements on the bsport platform. They are the only way to book a Class. Classes have a cost in credits, meaning that you cannot directly buy a class with a classic payment method (credit card, SEPA). First, you have to buy a pass, which contains credits.

    There are two types of passes:

    - With **limited** credits
    - With **unlimited** credits

    You can only book as many classes as you have credits left on your passes.

    > **Example**
    >
    > If I have a pass with 3 credits I will be able to book a class costing 2 credits. I won't be able to book another class that costs more than 1 credit.


    Unlimited passes have an unlimited amount of credits. You can book as many classes as you want with it.

    ### Exceptions
    | code | status | detail |
    |------|--------|--------|
    |CLI_PASS-001|404|Client pass not found|
    |BSPORT-500|500|An unexpected error occurred|
- name: Client Subscriptions
  description: |-
    Client subscriptions describe a client's recurring billing schedule
    for a purchased benefit (pass, appointment pass, or pack). Use this tag to
    audit upcoming billing, identify commitment periods, and reconcile invoices.
    Typical use cases include checking auto-renewal settings, understanding billing
    intervals, and locating plans tied to a specific client or benefit.

    Key details:
    - Filters: `benefit_type`, `benefit_id`, `client_id`, `id__in`
    - Includes billing cadence, pricing, commitment, and invoice references

    ### Exceptions
    | code | status | detail |
    |------|--------|--------|
    |CLI_SUB-001|404|Client subscription not found|
    |BSPORT-500|500|An unexpected error occurred|
- name: Clients
  description: |-
    Clients are the core customer records. Use these endpoints to list, create,
    retrieve, and archive clients.

    Key details:
    - Filters: `archived`, `email`, `barcode`, `joined_date__gte`, `joined_date__lte`,
      `id__in`
    - Archive performs a soft-delete for historical retention

    ### Exceptions
    | code | status | detail |
    |------|--------|--------|
    |CLI-001|404|Client not found|
    |CLI-101|409|Client already exists|
    |CLI-102|409|Timed out waiting to acquire exclusive lock.|
    |BSPORT-500|500|An unexpected error occurred|
- name: Deprecated - Billing Plans
  description: |-
    Billing plans describe a member's recurring billing schedule
    for a purchased benefit (payment pack, private pass, or combo). Use this tag to
    audit upcoming billing, identify commitment periods, and reconcile invoices.
    Typical use cases include checking auto-renewal settings, understanding billing
    intervals, and locating plans tied to a specific member or benefit.

    Key details:
    - Filters: `benefit_type`, `benefit_id`, `member_id`, `id__in`
    - Includes billing cadence, pricing, commitment, and invoice references

    ### Exceptions
    | code | status | detail |
    |------|--------|--------|
    |BPL-001|404|Billing Plan not found|
    |BSPORT-500|500|An unexpected error occurred|
- name: Deprecated - Bookings
  description: |-
    Bookings represent reservations for sessions. Use these endpoints to list,
    create, fetch, or cancel reservations for members. Common workflows include
    showing upcoming bookings, retrieving attendance history, and managing
    cancellations with optional refund/notification behavior.

    Key details:
    - Filters: `member_id`, `activity_id__in`, `booking_status_code`, date windows,
      `available`, `future_bookings`, `past_bookings`
    - Cancelling may accept options to notify and/or refund when permitted

    ### Exceptions
    | code | status | detail |
    |------|--------|--------|
    |BOO-001|404|Booking not found|
    |BOO-101|403|The pass is not compatible with the class|
    |BOO-102|403|Too many bookings for given pass|
    |BOO-103|403|Class not available for booking|
    |BOO-104|409|Failed to lock class spot|
    |BOO-105|409|Spot already taken|
    |BOO-106|403|Overbook not allowed for current Staff member|
    |BOO-107|403|The pass does not have enough credits for the class|
    |BOO-201|403|Past bookings cannot be cancelled|
    |BSPORT-500|500|An unexpected error occurred|
- name: Deprecated - Consumer Payment Packs
  description: |-
    Passes are one of the most important elements on the bsport platform. They are the only way to book a Session. Sessions have a cost in credits, meaning that you cannot directly buy a session with a classic payment method (credit card, SEPA). First, you have to buy a pass, which contains credits.

    There are two types of passes:

    - With **limited** credits
    - With **unlimited** credits

    You can only book as many sessions as you have credits left on your passes.

    > **Example**
    >
    > If I have a pass with 3 credits I will be able to book a session costing 2 credits. I won't be able to book another session that costs more than 1 credit.


    Unlimited passes have an unlimited amount of credits. You can book as many sessions as you want with it.

    ### Exceptions
    | code | status | detail |
    |------|--------|--------|
    |CPP-001|404|Consumer Payment Pack not found|
    |BSPORT-500|500|An unexpected error occurred|
- name: Deprecated - Contracts
  description: |-
    Contracts capture the commercial terms of a recurring purchase (pricing,
    commitment, renewal rules, benefits). Use these endpoints to list and inspect contract
    templates or instances that define payment behavior and member entitlements.

    Key details:
    - Filters: `id__in`, `disabled`, `manager_only`, `benefit_type`, `benefit_id`
    - Includes pricing, commitment, renewal, and billing configuration fields
    - Useful for explaining pricing rules shown in billing plans

    ### Exceptions
    | code | status | detail |
    |------|--------|--------|
    |CON-001|404|Contract not found|
    |BSPORT-500|500|An unexpected error occurred|
- name: Deprecated - Health
  description: |-
    Ping endpoints are health and connectivity checks. Use them to validate
    connectivity and, for authenticated ping, confirm API key and tenant header
    configuration.

    Key details:
    - `anon_ping` does not require authentication
    - `ping` validates API key and tenant headers
- name: Deprecated - Members
  description: |-
    Members are the core customer records. Use these endpoints to list, create,
    retrieve, and archive members. Member-scoped bookings endpoints provide a direct
    way to manage reservations for a specific member without additional filters.

    Key details:
    - Filters: `archived`, `email`, `barcode`, `joined_date__gte`, `joined_date__lte`,
      `id__in`
    - Archive performs a soft-delete for historical retention

    ### Exceptions
    | code | status | detail |
    |------|--------|--------|
    |MEM-001|404|Member not found|
    |MEM-101|409|Member already exists|
    |MEM-102|409|Timed out waiting to acquire exclusive lock.|
    |BSPORT-500|500|An unexpected error occurred|
- name: Deprecated - Payment Packs
  description: |-
    Payment packs define purchasable passes with pricing and usage rules.
    Use these endpoints to list and inspect what products are available to members.

    Key details:
    - Includes pricing, validity, and usage constraints
    - Supports list filtering for targeted discovery

    ### Exceptions
    | code | status | detail |
    |------|--------|--------|
    |PAC-001|404|Payment Pack not found|
    |BSPORT-500|500|An unexpected error occurred|
- name: Health
  description: |-
    Ping endpoints are health and connectivity checks. Use them to validate
    connectivity and, for authenticated ping, confirm API key and tenant header
    configuration.

    Key details:
    - `anon_ping` does not require authentication
    - `ping` validates API key and tenant headers
- name: Passes
  description: |-
    Passes define purchasable group class passes with pricing and usage rules.
    Use these endpoints to list and inspect what products are available to clients.

    Key details:
    - Includes pricing, validity, and usage constraints
    - Supports list filtering for targeted discovery

    ### Exceptions
    | code | status | detail |
    |------|--------|--------|
    |PASS-001|404|Pass not found|
    |BSPORT-500|500|An unexpected error occurred|
- name: Subscriptions
  description: |-
    Subscriptions capture the commercial terms of a recurring purchase (pricing,
    commitment, renewal rules, benefits). Use these endpoints to list and inspect subscription
    templates or instances that define payment behavior and client entitlements.

    Key details:
    - Filters: `id__in`, `disabled`, `manager_only`, `benefit_type`, `benefit_id`
    - Includes pricing, commitment, renewal, and billing configuration fields
    - Useful for explaining pricing rules shown in billing plans

    ### Exceptions
    | code | status | detail |
    |------|--------|--------|
    |SUB-001|404|Subscription not found|
    |BSPORT-500|500|An unexpected error occurred|
- name: Tag Groups
  description: |-
    Tag-group are folders of tags. A tag is always attached to one and only one tag-group, and one
    tag-group contains 0-N tags.

    Example: you might want to create a tag-group such as "Level" and related tags "Beginner",
    "Intermediate", "Expert", or simply a boolean tag-group: "VIP" with tags "YES" and "NO".

    ### Exceptions
    | code | status | detail |
    |------|--------|--------|
    |TGG-001|404|Tag group not found|
    |TGG-110|409|Tag group with same name already exists|
    |BSPORT-500|500|An unexpected error occurred|
- name: Tags
  description: |-
    Tag allows you the organize better your base of clients, it is also useful to create restrictions
    on certain passes or classes to restrict their usage only to a subset of your clients.

    A tag is always related to one and only one tag-group. A tag group is a category of tags.
    Example: you might want to create a tag-group such as "Level" and related tags "Beginner",
    "Intermediate", "Expert", or simply a boolean tag-group: "VIP" with tags "YES" and "NO".

    ### Exceptions
    | code | status | detail |
    |------|--------|--------|
    |TGG-002|404|Tag not found|
    |TGG-102|409|Tag with same name already exists within this tag-group|
    |BSPORT-500|500|An unexpected error occurred|
- name: Teachers
  description: |-
    A Teacher is linked to a company and can be assigned to one or several classes as the main instructor or as a substitute.

    This endpoint allows companies to read teacher information — including their profile information.

    A disabled teacher (`is_disabled: true`) remains visible but can no longer be assigned to new classes.

    ### Exceptions
    | code | status | detail |
    |------|--------|--------|
    |TEA-001|404|Teacher not found|
- name: Venues
  description: "A Venue is linked to a company and represents a physical establishment
    or room where classes take place.\nA venue holds details and configuration settings
    that define where and how classes are delivered.\n\nThis endpoint allows you to
    create a new venue, read the information of one or several venues, \nupdate their
    details, and archive an existing one.\n\nFilters: `is_disabled`, `city` and `zip_code`.\n\n###
    Exceptions\n| code | status | detail |\n|------|--------|--------|\n|VEN-001|404|Venue
    not found|\n|VEN-002|404|Country not resolved|"
- name: Webhook Registrations
  description: |-
    Public API webhook registrations subscribe the authenticated company to CDC-driven
    Public API events. They are created and managed only through these Public API endpoints.

    Backoffice webhooks configured in `Settings > Webhook` are a separate legacy system.
    They are never listed, retrieved, created, or updated by these endpoints, even when an
    event name exists in both systems. Their registrations, payloads, and delivery behavior
    are not shared with Public API webhooks.

    Each Public API registration targets one event and one destination URL. Disabling a
    registration stops new deliveries without deleting its configuration. See the
    [webhook setup guide](/webhooks/01-public-api-webhooks.html) and
    [event catalogue](/webhooks/02-public-api-event-reference.html).

    ### Exceptions
    | code | status | detail |
    |------|--------|--------|
    |WHR-001|404|Webhook registration not found|
