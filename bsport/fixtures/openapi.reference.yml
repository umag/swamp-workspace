          type: integer
          maximum: 2147483647
          minimum: 0
          nullable: true
        description:
          type: string
          nullable: true
          description: Description of the payment pack that will be displayed on the
            marketplace
        duration_days:
          type: integer
          maximum: 2147483647
          minimum: 0
          nullable: true
          description: "\n        Number of days before expiration of pack, after
            consumer payment.\n        Incompatible with validity_daterange field\n
            \       "
        duration_months:
          type: integer
          maximum: 2147483647
          minimum: 0
          nullable: true
          description: "\n        Number of months before expiration of pack, after
            consumer payment.\n        Incompatible with validity_daterange field\n
            \       "
        duration_years:
          type: integer
          maximum: 2147483647
          minimum: 0
          nullable: true
          description: "\n        Number of year before expiration of pack, after
            consumer payment.\n        Incompatible with validity_daterange field\n
            \       "
        establishment_ids:
          type: array
          items:
            type: integer
          readOnly: true
        expiration_date:
          type: string
          format: date
          nullable: true
          description: The moment when the payment pack expires and can no longer
            be bought.
        expiration_days_before_first_use:
          type: integer
          maximum: 2147483647
          minimum: 0
        grants_door_access:
          type: boolean
          description: If enabled, this pass grants physical access to the company's
            facilities through access control systems. Requires a configured access
            control system with its provider upsell activated.
        has_full_vod_access:
          type: boolean
        has_only_vod_access:
          type: boolean
        id:
          type: integer
          readOnly: true
        is_client_relation_auto_share:
          type: boolean
          nullable: true
        is_disabled:
          type: boolean
        is_editable:
          type: boolean
        is_highlighted_as_recommended:
          type: boolean
        is_manager_only:
          type: boolean
        is_new_client_only:
          type: boolean
        is_onsite_payment_available:
          type: boolean
        is_penalty_active:
          type: boolean
        is_unlimited:
          type: boolean
        is_usable_by_staff:
          type: boolean
          description: If False, the staff can't sell it outside of the subscriptions
        linked_private_pass_id:
          type: integer
          nullable: true
          readOnly: true
        max_purchase_per_client:
          type: integer
          nullable: true
        max_bookings_per_day:
          type: integer
          maximum: 32767
          minimum: 0
          nullable: true
        max_bookings_per_week:
          type: integer
          maximum: 32767
          minimum: 0
          nullable: true
        max_bookings_per_month:
          type: integer
          maximum: 32767
          minimum: 0
          nullable: true
        meta_activity_ids:
          type: array
          items:
            type: integer
          readOnly: true
        name:
          type: string
        no_show_penalty_active:
          type: boolean
          description: If set to true, a penalty will be applied on this payment pack
            if the number of no-shows exceed the value set in the field `no_show_penalty_threshold`.
        no_show_penalty_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,2})?$
          description: When the penalty for exceeding the no-show threshold is monetary,
            this is the amount billed to the customer.
        no_show_penalty_days_blocked:
          type: integer
          maximum: 32767
          minimum: 0
          description: When the penalty for exceeding the no-show threshold is set
            to block the pass, this is the number of days for which the pass is blocked.
        no_show_penalty_kind:
          enum:
          - 0
          - 1
          type: integer
          description: |-
            * `0` - block consumer_payment_pack
            * `1` - negative credit account
          x-spec-enum-id: 952736c2ec0de5d4
          minimum: 0
          maximum: 2147483647
        no_show_penalty_threshold:
          type: integer
          maximum: 32767
          minimum: 0
          description: When penalties for no-shows are enabled and the holder of this
            pass exceed this threshold, a penalty is applied.
        no_show_penalty_time_window_days:
          type: integer
          maximum: 32767
          minimum: 0
          description: The time window in days for which the threshold for the number
            of allowed no-shows is computed.
        off_peak_schedule:
          description: A JSON field representing the off-peak time slots schedule.
        ordering_in_category:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          nullable: true
        pass_category_id:
          type: integer
          nullable: true
        penalty_account_value:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,2})?$
        penalty_days_blocked:
          type: integer
          maximum: 32767
          minimum: 0
        penalty_days_count:
          type: integer
        penalty_kind:
          enum:
          - 0
          - 1
          type: integer
          description: |-
            * `0` - block consumer_payment_pack
            * `1` - negative credit account
          x-spec-enum-id: 952736c2ec0de5d4
          minimum: 0
          maximum: 2147483647
        penalty_late_cancellations_count:
          type: integer
        price:
          type: number
          format: double
          description: |-
            if hasattr(self, 'promotion'):
                if self.promotion:
                    return self.base_price * (1 - self.promotion / 100)
          readOnly: true
        should_allow_guest_pass:
          type: boolean
        start_date_method:
          enum:
          - 0
          - 1
          - 2
          type: integer
          description: |-
            * `0` - start_on_first_booking
            * `1` - start_on_first_attendance
            * `2` - start_on_purchase
          x-spec-enum-id: 93a09d6835295361
          minimum: 0
          maximum: 2147483647
        tags_on_client_pass_creation:
          type: array
          items:
            type: integer
          readOnly: true
        tax_rate:
          type: string
          format: decimal
          pattern: ^-?\d{0,9}(?:\.\d{0,3})?$
        template_instance_id:
          type: integer
          readOnly: true
          nullable: true
        theoretical_margin_value:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        validity_daterange:
          type: object
          properties:
            lower:
              type: string
              format: date
              nullable: true
            upper:
              type: string
              format: date
              nullable: true
            bounds:
              type: string
            empty:
              type: boolean
          nullable: true
          description: Dates on which the pack is active. Incompatible with duration_days
            field
