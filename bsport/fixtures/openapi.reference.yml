      - in: header
        name: X-Timezone-Name
        schema:
          type: string
        description: Header to override the client timezone for this API request.
        examples:
          Timezone:
            value: Europe/Paris
      - in: query
        name: activity_id__in
        schema:
          type: array
          items:
            type: number
        description: Multiple values may be separated by commas.
        explode: false
        style: form
      - in: query
        name: after_session_end_date
        schema:
          type: boolean
      - in: query
        name: available
        schema:
          type: boolean
      - in: query
        name: before_session_end_date
        schema:
          type: boolean
      - in: query
        name: booking_status_code
        schema:
          type: integer
          x-spec-enum-id: 6c8e279cc78e7405
          enum:
          - 0
          - 1
          - 2
          - 3
        description: |-
          Status of the booking. Possible values: 0=OK, 1=Cancelled by manager, 2=Cancelled by consumer, 3=Offer cancelled

          * `0` - OK
          * `1` - Cancelled by manager
          * `2` - Cancelled by consumer
          * `3` - Offer cancelled
      - in: query
        name: booking_status_code__in
        schema:
          type: array
          items:
            type: integer
        description: Multiple values may be separated by commas.
        explode: false
        style: form
      - in: query
        name: created_at_date__gte
        schema:
          type: string
          format: date
      - in: query
        name: created_at_date__lte
        schema:
          type: string
          format: date
      - in: query
        name: future_bookings
        schema:
          type: boolean
      - in: query
        name: has_attended
        schema:
          type: boolean
      - in: query
        name: id__in
        schema:
          type: array
          items:
            type: number
        description: Multiple values may be separated by commas.
        explode: false
        style: form
      - in: query
        name: location_id__in
        schema:
          type: array
          items:
            type: number
        description: Multiple values may be separated by commas.
        explode: false
        style: form
      - in: query
        name: member_id
        schema:
          type: number
      - in: query
        name: meta_activity_id__in
        schema:
          type: array
          items:
            type: number
        description: Multiple values may be separated by commas.
        explode: false
        style: form
      - in: query
        name: ordering
        schema:
          type: string
        description: |-
          Comma-separated list of fields to order by:
          - created_at
          - session_start_date

          Prefix with '-' for descending order.
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: pass_id
        schema:
          type: number
      - in: query
        name: past_bookings
        schema:
          type: boolean
      - in: query
        name: session_id
        schema:
          type: number
      - in: query
        name: session_id__in
        schema:
          type: array
          items:
            type: number
        description: Multiple values may be separated by commas.
        explode: false
        style: form
      - in: query
        name: session_is_workshop
        schema:
          type: boolean
      - in: query
        name: session_start_date__gte
        schema:
          type: string
          format: date
      - in: query
        name: session_start_date__lte
        schema:
          type: string
          format: date
      - in: query
        name: teacher_id__in
        schema:
          type: array
          items:
            type: number
        description: Multiple values may be separated by commas.
        explode: false
        style: form
      - in: query
        name: was_refunded
        schema:
          type: boolean
      tags:
      - Deprecated - Bookings
      security:
      - ApiKey: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDeprecatedBookingOutputList'
              examples:
                BookingResponseExample:
                  value:
                    count: 123
                    next: http://api.example.org/accounts/?page=4
                    next_page: 4
                    previous: http://api.example.org/accounts/?page=2
                    results:
                    - attendance_status_updated_at: '2025-11-25T13:53:53.535647+01:00'
