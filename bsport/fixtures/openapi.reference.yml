components:
  schemas:
    AppointmentOutput:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        service_id:
          type: integer
          description: ID of the service this appointment is based on.
        slot_id:
          type: integer
          description: ID of the private slot (duration/credits variant) for this
            appointment.
        company_id:
          type: integer
          description: ID of the company this appointment belongs to.
        is_cancelled:
          type: boolean
          readOnly: true
          description: True if the appointment has been cancelled by the client or
            a manager.
        client_id:
          oneOf:
          - type: integer
          - $ref: '#/components/schemas/ClientOutput'
          x-expandable: true
          x-expansionResources:
            oneOf:
            - $ref: '#/components/schemas/ClientOutput'
          description: ID of the client who booked this appointment.
        teacher_id:
          type: integer
          nullable: true
          readOnly: true
          description: ID of the teacher assigned to this appointment, or null if
            none is assigned.
        venue_id:
          oneOf:
          - type: integer
            nullable: true
          - $ref: '#/components/schemas/VenueOutput'
          x-expandable: true
          x-expansionResources:
            oneOf:
            - $ref: '#/components/schemas/VenueOutput'
          readOnly: true
          description: ID of the venue where this appointment takes place if relevant.
        name:
          type: string
          description: Name of the appointment.
        starts_at:
          type: string
          format: date-time
          description: Datetime when the appointment starts.
        ends_at:
          type: string
          format: date-time
          description: Datetime when the appointment ends.
        duration_in_minutes:
          type: integer
          description: Duration of the appointment in minutes.
        credit_price:
          type: integer
          description: Number of credits required for this appointment.
        image_url:
          type: string
          nullable: true
          readOnly: true
          description: URL of the service cover image, or null if none is set.
        cancelled_at:
          type: string
          format: date-time
          nullable: true
          description: Datetime when the appointment was cancelled, or null if still
            active.
        cancellable_until:
          type: string
          format: date-time
          readOnly: true
          description: Last datetime by which the appointment can be cancelled without
            a late-cancellation penalty.
      required:
      - cancellable_until
      - cancelled_at
      - client_id
      - company_id
      - credit_price
      - duration_in_minutes
      - ends_at
      - id
      - image_url
      - is_cancelled
      - name
      - service_id
      - slot_id
      - starts_at
      - teacher_id
      - venue_id
    BookingCancellationInput:
      type: object
      properties:
        should_force_notify:
          type: boolean
          default: false
          description: Override the default behaviour
        should_force_refund:
          type: boolean
          default: false
          description: Override the default behaviour
    BookingCreationInput:
      type: object
      properties:
        client_id:
          type: integer
          description: The id of the client for whom the booking is being created.
        client_pass_id:
          type: integer
          description: The id of the client pass to use for this booking request
        should_auto_assign_spot:
          type: boolean
          default: false
          description: Whether to automatically assign a spot
        should_keep_credits:
          type: boolean
          default: false
          description: Override the default behaviour
        should_notify_client:
          type: boolean
          default: true
          description: Override the default behaviour
        class_ids:
          type: array
          items:
            type: integer
          description: The ids of the classes (offers) to book.
        session_ids:
          type: array
          items:
            type: integer
          description: '[Deprecated] Use class_ids instead. The ids of the classes
            (offers) to book.'
        spot_id:
          type: integer
          description: The spot id for this booking request
      required:
      - client_id
      - client_pass_id
    BookingOutput:
      type: object
      description: Abstract serializer class to make all fields read-only.
      properties:
        attendance_status_updated_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        booking_status_code:
          type: string
          nullable: true
          readOnly: true
        canceled_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        class_id:
          oneOf:
          - type: integer
          - $ref: '#/components/schemas/ClassOutput'
          x-expandable: true
          x-expansionResources:
            oneOf:
            - $ref: '#/components/schemas/ClassOutput'
          readOnly: true
          description: ID of the class (offer) this booking is for.
        class_start_at:
          type: string
          format: date-time
          readOnly: true
          description: Datetime when the class starts.
        client_id:
          oneOf:
          - type: integer
          - $ref: '#/components/schemas/ClientOutput'
          x-expandable: true
          x-expansionResources:
            oneOf:
            - $ref: '#/components/schemas/ClientOutput'
          readOnly: true
        client_pass_id:
          oneOf:
          - type: integer
            nullable: true
          - $ref: '#/components/schemas/ClientPassManagementOutput'
          x-expandable: true
          x-expansionResources:
            oneOf:
            - $ref: '#/components/schemas/ClientPassManagementOutput'
          readOnly: true
        company_id:
          type: integer
          readOnly: true
          description: ID of the company that owns the booked class.
        created_at:
          type: string
          format: date-time
          readOnly: true
        credit_consumed:
          type: integer
          maximum: 32767
          minimum: 0
          readOnly: true
        has_attended:
          type: boolean
          readOnly: true
        has_no_show_penalty_applied:
          type: boolean
          readOnly: true
        id:
          type: integer
          readOnly: true
        is_client_first_booking:
          type: boolean
          readOnly: true
        is_credit_refunded:
          type: boolean
          readOnly: true
        is_no_show:
          type: boolean
          readOnly: true
          description: "\n        A no-show is registered when the booking was not
            cancelled but the consumer\n        was absent from the class and the
            presence status wasn't change in the time window\n        during which
            adjustments can be made.\n\n        Note that this can lead to penalties
            being applied on this consumer\n        payment pack.\n        "
        location_id:
          oneOf:
          - type: integer
          - $ref: '#/components/schemas/VenueOutput'
          x-expandable: true
          x-expansionResources:
            oneOf:
            - $ref: '#/components/schemas/VenueOutput'
          readOnly: true
        no_show_registered_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        session_id:
          type: integer
          readOnly: true
          description: '[Deprecated] Use class_id instead.'
        session_start_at:
          type: string
          format: date-time
          readOnly: true
          description: '[Deprecated] Use class_start_at instead.'
        source:
          type: string
          nullable: true
          readOnly: true
        spot_id:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          readOnly: true
          nullable: true
        spot_information:
          readOnly: true
          nullable: true
        substitute_teacher_id:
          type: integer
          readOnly: true
          nullable: true
        teacher_id:
          type: integer
          readOnly: true
      required:
      - attendance_status_updated_at
      - booking_status_code
      - canceled_at
      - class_id
      - class_start_at
      - client_id
      - client_pass_id
      - company_id
      - created_at
      - credit_consumed
      - has_attended
      - has_no_show_penalty_applied
      - id
      - is_client_first_booking
      - is_credit_refunded
      - is_no_show
      - location_id
      - no_show_registered_at
      - session_id
      - session_start_at
      - source
      - spot_id
      - spot_information
      - substitute_teacher_id
      - teacher_id
    BookingUpdateAttendanceInput:
      type: object
      properties:
        has_attended:
          type: boolean
          description: Whether the client attended the session.
      required:
      - has_attended
    BookingsListOutput:
      type: object
      properties:
        bookings:
          type: array
          items:
            $ref: '#/components/schemas/BookingOutput'
      required:
      - bookings
    ClassOutput:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        service_id:
          type: integer
          description: ID of the service (activity) this class session is based on.
        company_id:
          type: integer
          description: ID of the company this class belongs to.
        is_cancelled:
          type: boolean
          readOnly: true
          description: True if the class has been cancelled, false if it is still
            active.
        is_bookable_by_members:
          type: boolean
          readOnly: true
          description: False if the class is restricted to managers only, true if
            members can book it.
        credit_price:
          type: integer
          readOnly: true
          description: Number of credits required to book this class.
        teacher_id:
          oneOf:
          - type: integer
          - $ref: '#/components/schemas/TeacherOutput'
          x-expandable: true
          x-expansionResources:
            oneOf:
            - $ref: '#/components/schemas/TeacherOutput'
          description: ID of the effective teacher (substitute if assigned, otherwise
            the original teacher).
        venue_id:
          oneOf:
          - type: integer
          - $ref: '#/components/schemas/VenueOutput'
          x-expandable: true
          x-expansionResources:
            oneOf:
            - $ref: '#/components/schemas/VenueOutput'
          description: ID of the venue where this class takes place.
        level:
          type: string
          description: Difficulty level of the class (e.g. Beginner, All levels).
        is_teacher_substitute:
          type: boolean
          readOnly: true
          description: True if the class has a substitute teacher assigned, false
            otherwise.
        max_capacity:
          type: integer
          description: Maximum number of bookings allowed for this class.
        image_url:
          type: string
          nullable: true
          readOnly: true
          description: URL of the class cover image, or null if none is set.
        current_bookings:
          type: integer
          description: Current number of validated bookings.
        current_waiting_list_size:
          type: integer
          description: Current number of members on the waiting list.
        starts_at:
          type: string
          format: date-time
          description: Datetime when the class starts.
        duration_in_minutes:
          type: integer
          description: Duration of the class in minutes.
        max_waiting_list_size:
          type: integer
          description: Maximum number of members allowed on the waiting list.
        name:
          type: string
          description: Name of the class. Uses the session-level override if set,
            otherwise falls back to the class template name.
        description:
          type: string
          description: Description of the class. Uses the session-level override if
            set, otherwise falls back to the class template description.
        bookable_from:
          type: string
          format: date-time
          readOnly: true
          description: Datetime from which the class can be booked.
        bookable_until:
          type: string
          format: date-time
          readOnly: true
          description: Deadline datetime after which the class can no longer be booked.
        cancellable_until:
          type: string
          format: date-time
          readOnly: true
          description: Last datetime by which a booking can be cancelled without a
            late-cancellation penalty.
      required:
      - bookable_from
      - bookable_until
      - cancellable_until
      - company_id
      - credit_price
      - current_bookings
      - current_waiting_list_size
      - description
      - duration_in_minutes
      - id
      - image_url
      - is_bookable_by_members
      - is_cancelled
      - is_teacher_substitute
      - level
      - max_capacity
      - max_waiting_list_size
      - name
      - service_id
      - starts_at
      - teacher_id
      - venue_id
