      - is_disabled
      - is_editable
      - is_highlighted_as_recommended
      - is_manager_only
      - is_new_client_only
      - is_onsite_payment_available
      - is_penalty_active
      - is_unlimited
      - linked_private_pass_id
      - max_purchase_per_client
      - meta_activity_ids
      - name
      - pass_category_id
      - penalty_days_count
      - penalty_late_cancellations_count
      - price
      - should_allow_guest_pass
      - tags_on_client_pass_creation
      - tax_rate
      - template_instance_id
      - theoretical_margin_value
