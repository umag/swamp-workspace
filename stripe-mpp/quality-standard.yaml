# Hand-authored: stripe-mpp is the ONE extension that carries all five
# required suites today (see STANDARD.md "Seeding the baseline"). It is NOT
# on quality-allowlist.txt — every block this phase actually enforces
# (the five suites + docs) is "present", never "backlog".
schemaVersion: 1
extension: stripe-mpp
tests:
  contract-fixture:
    state: present
    files:
      - "extensions/models/stripe_mpp_test.ts"
      - "extensions/models/stripe_mpp_live_test.ts"
      - "extensions/models/lib/link_cli.test.ts"
  methods:
    state: present
    files:
      - "extensions/models/stripe_mpp_methods_test.ts"
  adversarial:
    state: present
    files:
      - "extensions/models/stripe_mpp_adversarial_test.ts"
  coverage:
    state: present
    files:
      - "extensions/models/stripe_mpp_coverage_test.ts"
  property-invariant-flow:
    state: present
    files:
      - "extensions/models/stripe_mpp_property_test.ts"
      - "extensions/models/stripe_mpp_invariant_property_test.ts"
      - "extensions/models/stripe_mpp_flow_property_test.ts"
watch:
  # Owned by Phase B (ext-quality-release-watch-soak): the executable
  # contract is scripts/lib/watch_schema.ts, consumed by the generic
  # .github/workflows/release-watch.yml (the bespoke stripe-mpp-release-
  # watch.yml was deleted in the same commit). Preserves the exact prior
  # behavior: mppx vs "latest"; stripe vs "public-preview" with "beta"
  # fallback (SPT endpoints ride the preview channel); @stripe/link-cli
  # OPTIONAL (required: false) — a missing/renamed pin must never fail the
  # whole run. Before bumping any pin, run the spec-fixture contract tests
  # (extensions/models/stripe_mpp_test.ts) — they pin the MPP wire format
  # and decide whether method code needs changes.
  state: present
  issueLabel: stripe-mpp-release-watch
  sources:
    - kind: npm
      package: mppx
      channel: latest
      pin:
        from: source
        file: extensions/models/stripe_mpp.ts
        pattern: 'npm:mppx@([0-9][^/"]*)'
        required: true
    - kind: npm
      package: stripe
      channel: public-preview
      channelFallback: beta
      pin:
        from: source
        file: extensions/models/stripe_mpp.ts
        pattern: 'npm:stripe@([0-9][^/"]*)'
        required: true
    - kind: npm
      package: "@stripe/link-cli"
      channel: latest
      pin:
        from: source
        file: extensions/models/stripe_mpp.ts
        pattern: 'linkCliVersion.*default\("([0-9][^"]*)"'
        required: false
canary:
  # Phase C's (ext-quality-live-canary) live-verification workflow does not
  # cover CI here; CI itself cannot hold real Stripe test-mode secrets.
  state: backlog
  justification: "live canary workflow not built yet — tracked in ext-quality-test-backfill"
# soak: stripe-mpp's test task grants an UNSCOPED --allow-net (broad, per
# scripts/lib/soak_permissions.ts's isBroadGrant) because its suite stubs
# `fetch` entirely rather than scoping to specific Stripe/mppx hosts — there
# is no narrower real host list to enumerate. Narrowed here to just
# --allow-env (the property test harness only needs FC_NUM_RUNS, and an
# unscoped --allow-env trivially covers it) per checkSoakAuthority — an
# unattended nightly soak must never silently inherit unscoped network
# access. Tracked in ext-quality-release-watch-soak (Phase B,
# property-soak-permission-source-of-truth).
soak:
  state: present
  denoArgs:
    - "--allow-env"
docs:
  readme:
    state: present
    files:
      - "README.md"
  changelog:
    state: present
    files:
      - "CHANGELOG.md"
  skill:
    state: present
    files:
      - ".claude/skills/stripe-mpp/SKILL.md"
ratchet:
  rubricVersion: 3
  baselinePercentage: 100
  label: "Grade A"
