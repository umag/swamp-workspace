<!DOCTYPE html>
<html>
  <head><title>Fixture Grid Artist | Bandcamp</title></head>
  <body>
    <!-- No JSON-LD on this page -- discography must come entirely from the
     `#music-grid .music-grid-item` DOM fallback. -->

      <span class="title">Fixture Grid Artist</span>
      <span class="location">Utrecht, Netherlands</span>
    </p>
    <div class="bio-text">
      A synthetic fixture bio for the grid-based discography artist page.
    </div>
    <div class="popupImage">
      <img src="https://f4.bcbits.example.com/img/grid-artist.jpg">
    </div>
    <ol id="music-grid">
      <li class="music-grid-item">
        <a
          href="https://fixture-grid-artist.example.com/album/fixture-grid-album-one"
        ><p class="title">Fixture Grid Album One</p></a>
      </li>
      <li class="music-grid-item">
        <a
          href="https://fixture-grid-artist.example.com/album/fixture-grid-album-two"
        ><p class="title">Fixture Grid Album Two</p></a>
      </li>
    </ol>
  </body>
</html>
