manifestVersion: 1
name: "@magistr/issue-lifecycle"
version: "2026.08.31.1"
description: |
  Issue lifecycle model with 9 bundled Claude Code skills for DDD, TDD,
  moldable development, and parallel code review.

  Drives issues from filing through triage, prior-art lookup, DDD + TDD
  planning, parallel review fan-out (5 review skills), autonomous
  code-review iteration (zero CRITICAL + zero HIGH gate), optional UAT/KB
  harvest, and completion. State persists across sessions via the `state`
  resource; the `hydrate` method writes a cheap `summary` resource for
  long autonomous loops.

  ## State Machine

  ```
  filed ──[triage]──> triaged
  triaged ──[plan]──> planned
  planned ──[review_plan]──> reviewing
  reviewing ──[approve_plan]──> approved
  reviewing ──[reject_plan]──> planned  (feedback loop)
  approved ──[implement]──> writing_tests
  writing_tests ──[review_tests]──> reviewing_tests
  reviewing_tests ──[iterate_tests]──> writing_tests  (autonomous TDD sub-loop)
  reviewing_tests ──[tests_approved]──> implementing  (autonomous gate)
  implementing ──[verify]──> verifying
  verifying ──[iterate_verification]──> implementing  (autonomous loop)
  verifying ──[review_code]──> code_reviewing  (the ONLY path onward)
  code_reviewing ──[resolve_findings]──> resolved
  code_reviewing ──[iterate]──> implementing  (autonomous loop)
  resolved ──[iterate]──> implementing
  resolved ──[attest]──> attested  (optional)
  resolved ──[harvest]──> harvested  (optional)
  resolved ──[complete]──> complete
  attested ──[harvest]──> harvested
  attested ──[complete]──> complete
  harvested ──[complete]──> complete
  ```

  `approve_plan` requires full matrix coverage AND zero open CRITICAL AND
  zero open HIGH findings AND no reviewer FAIL verdict. `tests_approved`
  enforces the same gate autonomously (override bypasses both dimensions).
  `close` works from any state. `start` refuses to overwrite an in-flight
  issue (any state other than complete/closed) unless `force:true` is
  passed.

  ## Pre-PR verification and attestation

  `verify` runs the repository's declared mechanical controls (fmt, lint,
  typecheck, tests) in one fan-out pass and records per-control status,
  exit code, duration and runner. `review_code` is guarded on `verifying`,
  so no path reaches code review without running the controls. A control
  that could not be executed is recorded as `error` — never as a skip —
  and blocks exactly as a failure does.

  `attest` emits a manifest (commit sha, SHA-256 config checksums, control
  results, per-reviewer finding counts) that CI validates in place of
  re-executing the controls. It asserts every gate before writing and
  refuses otherwise; it does not approve anything.

  ## Methods

  - `start` — file a new issue (refuses to overwrite an in-flight issue
    unless `force:true`)
  - `triage` — classify with optional confidence/regression/reproduction
  - `record_prior_art` — record existing UAT scenarios and KB entries
  - `record_reproduction` — record/update the bug-reproduction outcome after
    triage (optional; callable from triaged or planned)
  - `plan` — create/revise plan with DDD analysis, TDD strategy, review matrix
  - `review_plan` — enter plan review phase
  - `record_review` — record one reviewer's findings (a second submission in
    the same round replaces, not appends)
  - `approve_plan` — approve (gated on coverage + zero blocking findings +
    no FAIL verdict)
  - `reject_plan` — reject with auto/human source tracking
  - `implement` — start TDD on a branch (enters `writing_tests`)
  - `review_tests` — enter test review phase
  - `iterate_tests` — loop back on test-review findings (bumps testReviewIteration)
  - `tests_approved` — tests clean → write code (autonomous gate; supports
    `override_reason` for explicit human force-approve after 5-iteration cap,
    bypassing both the blocking-findings and FAIL-verdict gates)
  - `verify` — run every declared mechanical control in one pass (enters
    `verifying`); controls come from
    `agent-constraints/verification-controls.md`, never hardcoded
  - `iterate_verification` — loop back on a failing control (bumps
    verificationIteration)
  - `review_code` — enter code review phase (requires `verifying`)
  - `resolve_findings` — record resolutions keyed per matching reviewer,
    snapshot round
  - `iterate` — return to implementation (bumps codeReviewIteration)
  - `attest` — emit the attestation manifest CI validates (enters `attested`)
  - `harvest` — record UAT/KB improvement proposals
  - `complete` — mark done
  - `close` — abandon from any state
  - `hydrate` — write compact summary for autonomous loops

  ## Bundled Skills

  - `issue-lifecycle` — orchestrates the full lifecycle
  - `ddd` — domain-driven design building block selection
  - `tdd` — red-green-refactor workflow enforcement
  - `moldable-dev` — contextual inspectors and live-data queries
  - `review-code` — general code review
  - `review-adversarial` — adversarial review (7 dimensions)
  - `review-security` — OWASP-adapted security audit
  - `review-ux` — CLI output and error message review
  - `review-skill` — skill quality review

