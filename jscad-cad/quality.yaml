ratchet:
  rubricVersion: 3
  baselinePercentage: 0
  label: >-
    UNSCORABLE — swamp extension quality errors on script_evaluator.ts's
    template-literal `import * as serializer from "${pkg}";` (inside
    buildEvalScript's returned eval-script source): the scorer's static
    import-specifier scanner misreads the runtime-interpolated `"${pkg}"` as
    an unresolvable bare specifier and refuses to score the extension at
    all. This predates the backfill and is intentionally left intact by the
    2026.08.02.1 B3/B4/B5 real-fix (out of scope; de-obfuscating it would
    restore no score, since the extension is unscorable for this reason
    alone) — the same class of scorer blind spot as seanime's
    broken-version-chain unscorable case. score_ratchet.ts reports an
    unscorable extension as SKIPPED, not a CI failure. The naive-scanner-
    evasion pattern behind this false positive is the SAME PATTERN as N3
    (the `globalThis["Func"+"tion"]` split, tracked as an accepted-residual
    in jscad-cad-latent-bugs, no longer characterized as "root cause of open
    B1" now that B1 is fixed and contained) and is separately tracked in
    workspace-ratchet-scorer-blockers; do not attempt to fix the scanner or
    the import here.
